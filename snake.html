<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020617">
<title>SNAKE.EXE — Jack's Arcade</title>
<style>
:root{color-scheme:dark;--line:#12453b;--neon:#00ff9c;--cyan:#00d9ff;--muted:#91aaa6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:transparent;color:#d9fff0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;display:grid;place-items:center;padding:clamp(10px,2.5vw,28px);overflow-x:hidden;isolation:isolate}body::before{content:"";position:fixed;inset:0;background:#020617;z-index:-1;pointer-events:none}
#matrix{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;opacity:.34;pointer-events:none}
main{width:min(100%,900px);position:relative;z-index:1}
.top{text-align:center;margin-bottom:22px}.tag{font-size:11px;letter-spacing:.22em;color:var(--neon)}h1{font-size:clamp(30px,7vw,48px);letter-spacing:.08em;margin:10px 0;color:var(--neon);text-shadow:0 0 22px #00ff9c55}.sub{color:var(--muted);font-size:13px}
.panel{border:1px solid #00ff9c66;background:rgba(3,12,22,.84);backdrop-filter:blur(12px);border-radius:20px;padding:clamp(12px,3vw,26px);box-shadow:0 0 55px #00ff9c18,inset 0 0 34px #00d9ff08}
.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}.score strong{color:var(--neon);font-size:20px}.state{color:var(--cyan);text-align:right}
canvas#game{display:block;width:min(100%,680px);aspect-ratio:1;height:auto;margin:0 auto;border:1px solid #1b7258;border-radius:12px;background:rgba(1,7,13,.97);image-rendering:pixelated;touch-action:none;box-shadow:0 0 30px #00ff9c12}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0 4px}.actions button{min-width:170px;padding:13px 18px}button,a{font:inherit;text-decoration:none;color:var(--neon);background:#061b1a;border:1px solid #16876a;border-radius:8px;padding:11px 16px;cursor:pointer}button:hover,a:hover{background:#0a3029;box-shadow:0 0 18px #00ff9c20}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.controls{display:grid;grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,48px);gap:8px;justify-content:center;margin:18px auto 8px}.controls button{padding:0;font-size:18px;touch-action:manipulation}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.hint{text-align:center;color:var(--muted);font-size:11px;line-height:1.7;margin-top:15px}.hint span{color:var(--neon)}.back{display:inline-block;margin-top:16px;font-size:12px}
@media(min-width:700px){.controls{display:none}}@media(max-width:480px){body{padding:8px}.top{margin-bottom:14px}.panel{padding:10px;border-radius:14px}.hud{font-size:11px}.score strong{font-size:18px}.actions button{min-width:0;flex:1;padding:12px 8px;font-size:12px}.controls{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,46px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="matrix" aria-hidden="true"></canvas>
<main>
<header class="top"><div class="tag">JACK // ARCADE SUBSYSTEM</div><h1>SNAKE.EXE</h1><div class="sub">One more run. Beat your own high score.</div></header>
<section class="panel" aria-label="Snake game">
<div class="hud"><div class="score">SCORE <strong id="score">000</strong><br><span class="sub">BEST <span id="best">000</span></span></div><div class="state" id="status" aria-live="polite">PRESS START</div></div>
<canvas id="game" width="480" height="480" aria-label="Snake game board"></canvas>
<div class="actions"><button id="start">▶ START / RESTART</button><button id="pause">Ⅱ PAUSE</button></div>
<div class="controls" aria-label="Touch controls"><button class="up" data-dir="up" aria-label="Up">▲</button><button class="left" data-dir="left" aria-label="Left">◀</button><button class="down" data-dir="down" aria-label="Down">▼</button><button class="right" data-dir="right" aria-label="Right">▶</button></div>
<div class="hint">MOVE: <span>ARROW KEYS</span> / <span>W A S D</span> · PAUSE: <span>SPACE</span><br>Eat the glowing nodes. Avoid the walls and your own trail.</div>
</section>
<div style="text-align:center"><a class="back" href="https://github.com/digital-coder-jack/digital-coder-jack">↖ BACK TO PROFILE</a></div>
</main>
<script>
// Decorative Matrix rain, kept separate from gameplay and disabled for reduced-motion preferences.
(() => {
 const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d');
 const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 let columns=[],font=13,width=0,height=0,raf=0;
 function resize(){const dpr=Math.min(window.devicePixelRatio||1,1.5);width=window.innerWidth;height=window.innerHeight;canvas.width=Math.floor(width*dpr);canvas.height=Math.floor(height*dpr);canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);columns=Array.from({length:Math.ceil(width/font)},()=>Math.random()*-height/font)}
 function draw(){ctx.fillStyle='rgba(2,6,23,.045)';ctx.fillRect(0,0,width,height);ctx.font=font+'px monospace';for(let i=0;i<columns.length;i++){const ch=chars[Math.floor(Math.random()*chars.length)],x=i*font,y=columns[i]*font;ctx.fillStyle=Math.random()>.975?'#c8ffe8':'#00ff9c';ctx.fillText(ch,x,y);if(y>height&&Math.random()>.975)columns[i]=0;columns[i]+=.10+Math.random()*.14}raf=requestAnimationFrame(draw)}
 if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){resize();draw();window.addEventListener('resize',resize,{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf)}else if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)draw()})}
})();
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status'),startBtn=document.getElementById('start'),pauseBtn=document.getElementById('pause');
const cells=24,size=canvas.width/cells;let snake=[],food=null,dir={x:1,y:0},nextDir={x:1,y:0},score=0,best=0,timer=null,running=false,paused=false;
try{best=Number(localStorage.getItem('jack-snake-best')||0)}catch{}bestEl.textContent=String(best).padStart(3,'0');
const speed=()=>Math.max(175,225-Math.floor(score/100)*4);
function stopTimer(){if(timer!==null){clearInterval(timer);timer=null}}
function spawnFood(){const empty=[];for(let y=0;y<cells;y++)for(let x=0;x<cells;x++)if(!snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});food=empty.length?empty[Math.floor(Math.random()*empty.length)]:null}
function reset(){stopTimer();snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;running=true;paused=false;spawnFood();scoreEl.textContent='000';statusEl.textContent='RUNNING';pauseBtn.textContent='Ⅱ PAUSE';draw();timer=setInterval(tick,speed())}
function setDirection(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(!d||d.x===-nextDir.x&&d.y===-nextDir.y)return;nextDir=d}
function tick(){if(!running||paused)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eating=!!food&&head.x===food.x&&head.y===food.y;const body=eating?snake:snake.slice(0,-1);if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||body.some(p=>p.x===head.x&&p.y===head.y)){gameOver();return}snake.unshift(head);if(eating){score+=10;scoreEl.textContent=String(score).padStart(3,'0');if(score>best){best=score;bestEl.textContent=String(best).padStart(3,'0');try{localStorage.setItem('jack-snake-best',String(best))}catch{}}spawnFood();if(!food){gameOver(true);return}stopTimer();timer=setInterval(tick,speed())}else snake.pop();draw()}
function gameOver(won=false){running=false;stopTimer();statusEl.textContent=won?'BOARD CLEARED':'GAME OVER';draw();ctx.fillStyle='rgba(2,6,23,.78)';ctx.fillRect(0,0,480,480);ctx.textAlign='center';ctx.fillStyle=won?'#00ff9c':'#ff6688';ctx.font='bold 25px monospace';ctx.fillText(won?'BOARD CLEARED':'SYSTEM HALTED',240,220);ctx.fillStyle='#d9fff0';ctx.font='15px monospace';ctx.fillText('SCORE: '+score,240,252);ctx.font='12px monospace';ctx.fillText('Press START to play again',240,280)}
function draw(){ctx.clearRect(0,0,480,480);ctx.strokeStyle='rgba(0,255,156,.055)';ctx.lineWidth=1;for(let i=0;i<=cells;i++){ctx.beginPath();ctx.moveTo(i*size,0);ctx.lineTo(i*size,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size);ctx.lineTo(480,i*size);ctx.stroke()}if(food){ctx.fillStyle='#00d9ff';ctx.shadowColor='#00d9ff';ctx.shadowBlur=18;ctx.beginPath();ctx.roundRect(food.x*size+4,food.y*size+4,size-8,size-8,5);ctx.fill();ctx.shadowBlur=0}snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#d7fff0':'#00ff9c';ctx.shadowColor=i===0?'#d7fff0':'#00ff9c';ctx.shadowBlur=i===0?13:5;ctx.beginPath();ctx.roundRect(p.x*size+2,p.y*size+2,size-4,size-4,4);ctx.fill()});ctx.shadowBlur=0}
function togglePause(){if(!running)return;paused=!paused;statusEl.textContent=paused?'PAUSED':'RUNNING';pauseBtn.textContent=paused?'▶ RESUME':'Ⅱ PAUSE';if(paused)stopTimer();else timer=setInterval(tick,speed())}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();setDirection(map[e.key])}if(e.code==='Space'){e.preventDefault();togglePause()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDirection(b.dataset.dir)));startBtn.addEventListener('click',reset);pauseBtn.addEventListener('click',togglePause);
snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];spawnFood();draw();
})();
</script>
</body>
</html>
