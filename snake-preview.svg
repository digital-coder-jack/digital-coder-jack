<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">SNAKE.EXE — animated game preview</title>
<desc id="desc">A neon green snake loops around a dark retro arcade grid, eats a glowing cyan food node, and the food respawns.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061a28"/><stop offset="1" stop-color="#020617"/></linearGradient>
  <!-- grid is anchored to the board origin (34,60) so snake cells line up exactly -->
  <pattern id="grid" x="34" y="60" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#00ff9c" stroke-opacity=".12"/></pattern>
  <!-- small per-element glow region = cheap to render -->
  <filter id="glow" filterUnits="userSpaceOnUse" x="-32" y="-32" width="64" height="64"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- frame -->
<rect width="900" height="340" rx="18" fill="url(#bg)"/>
<rect x="12" y="12" width="876" height="316" rx="12" fill="none" stroke="#00ff9c" stroke-opacity=".45"/>
<text x="34" y="43" font-family="monospace" font-size="15" fill="#00ff9c" letter-spacing="3">SNAKE.EXE</text>
<text x="866" y="43" text-anchor="end" font-family="monospace" font-size="12" fill="#7baca0">ARCADE // LIVE DEMO</text>

<!-- board: 32 x 9 cells of 26px -->
<rect x="34" y="60" width="832" height="234" rx="6" fill="#020914" fill-opacity=".55"/>
<rect x="34" y="60" width="832" height="234" rx="6" fill="url(#grid)" stroke="#00ff9c" stroke-opacity=".3"/>

<!-- food at cell (28,4): pulses, pops when the head arrives (t = 7s of 17s), respawns after the tail passes -->
<g transform="translate(775 177)">
  <circle r="0" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0">
    <animate attributeName="r" values="0;0;28" keyTimes="0;0.41;0.5" dur="17s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.41;0.4101;0.5;1" dur="17s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#glow)">
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.405;0.42;0.52;0.56;1" dur="17s" repeatCount="indefinite"/>
    <circle r="11" fill="#00d9ff"><animate attributeName="r" values="9;12;9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle r="4" fill="#dffcff"/>
  </g>
</g>

<!-- snake: every segment follows the same CLOSED loop, delayed by 0.25s (= 1 cell) per segment.
     Loop = 68 cells at 4 cells/s = 17s. Tail first, head last so the head draws on top. -->
<rect x="-8" y="-8" width="16" height="16" rx="4" fill="#00ff9c" fill-opacity=".6" filter="url(#glow)"><animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="-15s" repeatCount="indefinite" calcMode="paced"/></rect>
<rect x="-9" y="-9" width="18" height="18" rx="4" fill="#00ff9c" fill-opacity=".7" filter="url(#glow)"><animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="-15.25s" repeatCount="indefinite" calcMode="paced"/></rect>
<rect x="-10" y="-10" width="20" height="20" rx="4.5" fill="#00ff9c" fill-opacity=".8" filter="url(#glow)"><animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="-15.5s" repeatCount="indefinite" calcMode="paced"/></rect>
<rect x="-10.5" y="-10.5" width="21" height="21" rx="5" fill="#00ff9c" fill-opacity=".85" filter="url(#glow)"><animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="-15.75s" repeatCount="indefinite" calcMode="paced"/></rect>
<rect x="-11" y="-11" width="22" height="22" rx="5" fill="#00ff9c" fill-opacity=".9" filter="url(#glow)"><animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="-16s" repeatCount="indefinite" calcMode="paced"/></rect>
<rect x="-11" y="-11" width="22" height="22" rx="5" fill="#00ff9c" fill-opacity=".95" filter="url(#glow)"><animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="-16.25s" repeatCount="indefinite" calcMode="paced"/></rect>
<rect x="-11" y="-11" width="22" height="22" rx="5" fill="#00ff9c" filter="url(#glow)"><animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="-16.5s" repeatCount="indefinite" calcMode="paced"/></rect>
<rect x="-11" y="-11" width="22" height="22" rx="5" fill="#00ff9c" filter="url(#glow)"><animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="-16.75s" repeatCount="indefinite" calcMode="paced"/></rect>
<g filter="url(#glow)">
  <rect x="-12" y="-12" width="24" height="24" rx="6" fill="#d7fff0"/>
  <circle cx="5" cy="-6" r="2.6" fill="#020617"/>
  <circle cx="5" cy="6" r="2.6" fill="#020617"/>
  <animateMotion path="M125 99H775V255H541V177H359V255H125Z" dur="17s" begin="0s" repeatCount="indefinite" calcMode="paced" rotate="auto"/>
</g>

<text x="34" y="316" font-family="monospace" font-size="12" fill="#7baca0">AUTO DEMO</text>
<text x="866" y="316" text-anchor="end" font-family="monospace" font-size="12" fill="#00ff9c">CLICK TO PLAY ↗</text>
</svg>
